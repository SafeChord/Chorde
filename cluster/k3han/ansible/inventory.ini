# Inventory file for SafeChord / K3han cluster nodes

[all-nodes]
acer-agent ansible_host=100.64.1.21 node_region=tw node_tier=medium node_ha_level=local-24h node_provider=local node_platform=bare-metal node_external_ip="" node_roles=""
gce-agent-tw ansible_host=100.64.2.21 node_region=tw node_tier=low node_ha_level=cloud-ha node_provider=gce node_platform=vm node_external_ip="35.206.205.160" node_roles=""
ct-serv-jp ansible_host=100.64.3.10 node_region=jp node_tier=medium node_ha_level=cloud-ha node_provider=contabo node_platform=vm node_external_ip="" node_roles="control-plane"
; laptop-agent ansible_host=100.64.1.31 node_region=tw node_tier=medium node_ha_level=on-demand node_provider=local node_platform=bare-metal node_external_ip="" node_roles=""
; desktop-agent ansible_host=100.64.1.32 node_region=tw node_tier=high node_ha_level=on-demand node_provider=local node_platform=bare-metal node_external_ip="" node_roles=""
# laptop-agent, desktop-agent are standby node

# Variables Explanation:
# node_region    - Deployment region, e.g., tw, sin
# node_tier      - Node resource tier: low, medium, high
# node_ha_level  - High Availability level: cloud-ha, local-24h, on-demand
# node_provider  - Machine provider: local, gce, contabo
# node_platform  - Hardware class: bare-metal, vm. Bare metal has firmware the
#                  operator manages; a VM has none, so firmware tooling is dead
#                  weight there. Not derivable from node_provider: a VM run at
#                  home is still node_provider=local.
# node_external_ip - Reserved public address, where one is deliberately held and
#                  recorded. Empty means NOT RECORDED HERE, which is not the
#                  same as "none exists":
#                    - acer-agent sits behind a dynamic residential address.
#                      It is not stable and this repo is public, so it is
#                      deliberately omitted.
#                    - ct-serv-jp does hold a static public address. Whether
#                      to publish the sole control plane's address in a public
#                      repo is its own decision and has not been made.
#                  gce-agent-tw is recorded because it is the Cloudflare origin:
#                  the value is already public in this repo's issues, and the
#                  lockdown rests on the GCP firewall allowlist, not on the
#                  address being secret. Reserved as gce-agent-tw-static-ip in
#                  asia-east1; before Chorde#13 it was ephemeral, so any stop
#                  would have changed it and broken the origin with a 522.
# node_roles     - Comma-separated roles assigned to the node

# Example expansion:
# next-edge-agent ansible_host=<vpn_ip_address> node_region=<region> node_tier=<tier> node_ha_level=<ha-level> node_provider=<provider> node_platform=<bare-metal|vm> node_external_ip="<reserved-public-ip|>" node_roles="<role1,role2>"

