---
- name: Provision Generic Agent into K3han Cluster (Generic Playbook)
  hosts: all_nodes
  become: yes

  vars:
    k3s_server_ip: "<CT-SERV-JP_VPN_IP>"            # Example: 100.100.x.x
    k3s_token: "<K3S_CLUSTER_JOIN_TOKEN>"
    # Inventory name of the control plane. The pod-CIDR lookups are delegated
    # to it: it is the one node with an admin kubeconfig. Chorde#16.
    k3s_server_host: ct-serv-jp

    # The single source for the sysctl invariants. Both drop-in bodies, the
    # read-back argument list and the assert's expected values all derive from
    # this map, so they cannot drift apart. The command is generated from the
    # same insertion-ordered map as the expected values, so reordering a key
    # cannot silently make the assert compare the wrong pairs either. Chorde#10.
    #
    # Order here is the order the read-back reports; keep the two files' keys
    # grouped so the map reads as the union of what they write.
    k3s_sysctl_invariants:
      net.ipv4.ip_forward: 1
      net.ipv4.conf.all.rp_filter: 2
      net.ipv4.conf.default.rp_filter: 2
      net.bridge.bridge-nf-call-iptables: 1
      fs.inotify.max_user_instances: 8192
      fs.inotify.max_user_watches: 524288

  # PRECONDITION: the node is already on the tailnet.
  #
  # This play connects over Tailscale -- every ansible_host in inventory.ini is
  # a 100.64.x address -- so joining the tailnet cannot be a task inside it.
  # Ansible would have had to reach the node over the tailnet to run the task
  # that puts it on the tailnet. No play keyword escapes that: pre_tasks runs in
  # this same play over this same connection, and so does everything else. The
  # only shape that works inside ansible is a separate play on hosts: localhost
  # driving the provider's API, which is a different job from this one.
  #
  # Bootstrap therefore belongs to the provider layer -- cloud-init, a startup
  # script, or baked into the image. That is still automation and still scales;
  # it just sits one layer below ansible:
  #
  #     apt install tailscale
  #     tailscale up --authkey <key> --advertise-tags=tag:edge-node
  #
  # This play picks the node up from that state onward. These two commands used
  # to be tasks here; they were never reachable.

  tasks:
    # --- Node sysctl baseline ------------------------------------------------
    # Runs first: k3s needs the inotify headroom from the moment it starts, and
    # every k3s Service depends on ip_forward being 1 -- as does the Tailscale
    # subnet routing this play arrives over, which is already up by then (see
    # the precondition above).
    #
    # ORDER IS LOAD-BEARING. Both drop-ins are written BEFORE `sysctl --system`,
    # never after. The reload re-applies every file in the sysctl.d search path
    # in lexical order, so on a node still carrying a vendor baseline that
    # declares ip_forward=0 -- the GCE image ships exactly that in
    # 60-gce-network-security.conf -- reloading first re-asserts 0 and takes
    # that node's ingress down until the override lands. That is how SafeZone#63
    # happened: an inotify reload on a node whose disk and runtime had disagreed
    # about ip_forward for 492 days. Chorde#10.

    # net.bridge.* keys exist only while br_netfilter is loaded. k3s loads it
    # at service start, but this baseline runs before k3s is installed on a
    # fresh node, and sysctl --system and the read-back would both fail on the
    # missing key. Load it now and persist it across reboots. Chorde#16.
    - name: Persist br_netfilter
      copy:
        dest: /etc/modules-load.d/br_netfilter.conf
        owner: root
        group: root
        mode: '0644'
        content: "br_netfilter\n"
      tags: sysctl

    - name: Load br_netfilter
      modprobe:
        name: br_netfilter
        state: present
      tags: sysctl

    - name: Raise inotify quotas for k3s
      copy:
        dest: /etc/sysctl.d/99-k3s-inotify.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          # k3s runs every component as uid 0, and fs.inotify.max_user_instances
          # is a per-uid quota. The stock 128 saturates roughly 13 minutes after
          # boot on a control plane carrying ~31 pods: k3s-server alone holds
          # ~42 instances, each containerd-shim 3-4. Once saturated,
          # inotify_init() returns EMFILE for every uid-0 caller -- including
          # PID 1, which then loses mount-table tracking, cannot restart
          # journald, and wedges the node while it stays up and reachable, so
          # nothing alerts. Chorde#10.
          #
          # This is NOT the fd rlimit. That is 1048576 and irrelevant here; the
          # two only share the "Too many open files" string.
          fs.inotify.max_user_instances = {{ k3s_sysctl_invariants['fs.inotify.max_user_instances'] }}
          fs.inotify.max_user_watches = {{ k3s_sysctl_invariants['fs.inotify.max_user_watches'] }}
      tags: sysctl

    - name: Assert k3s network invariants over the image baseline
      copy:
        dest: /etc/sysctl.d/99-k3s-network.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          # Sorts after any vendor baseline in /etc/sysctl.d. Last write wins,
          # and filename order is the only arbitration mechanism sysctl.d has --
          # there is no notion of priority. Do not renumber below 60-.
          #
          # ip_forward: every Service and hostPort is a DNAT. The packet is
          # rewritten to a pod IP and is then no longer addressed to the host,
          # so it must be forwarded. At 0 the SYN is accepted, rewritten, then
          # dropped with no RST -- the client sees a timeout (Cloudflare 522,
          # not 521), while ICMP to the same host keeps answering because local
          # delivery needs no forwarding. `ping` works while TCP times out is
          # the fingerprint. k3s sets this to 1 at startup, so a node can
          # disagree with its own disk indefinitely without symptom, until
          # something runs `sysctl --system`.
          #
          # rp_filter: loose (2), not strict (1). The effective value is
          # max(conf.all, conf.<iface>), so conf.all decides and no
          # per-interface setting can relax it. Cross-node pod packets arrive
          # on tailscale0 (Tailscale's table 52 carries the pod CIDRs), but
          # the reverse route for their pod source in the main table is
          # flannel's `via flannel.1`. Different interface, so strict mode
          # drops every cross-node pod packet. Loose mode is what keeps pod
          # networking up, not a tolerance for overlay noise. Enumerating
          # interfaces here is not possible anyway -- veth* are created and
          # destroyed continuously. Chorde#16.
          #
          # bridge-nf-call-iptables: same-node pod traffic is switched at L2
          # inside the cni0 bridge and never reaches IP forwarding. This hands
          # it to iptables anyway, which is the only reason NetworkPolicy
          # (kube-router's physdev rules) sees it. At 0 same-node policy stops
          # applying, with no error. Chorde#16.
          net.ipv4.ip_forward = {{ k3s_sysctl_invariants['net.ipv4.ip_forward'] }}
          net.ipv4.conf.all.rp_filter = {{ k3s_sysctl_invariants['net.ipv4.conf.all.rp_filter'] }}
          net.ipv4.conf.default.rp_filter = {{ k3s_sysctl_invariants['net.ipv4.conf.default.rp_filter'] }}
          net.bridge.bridge-nf-call-iptables = {{ k3s_sysctl_invariants['net.bridge.bridge-nf-call-iptables'] }}
      tags: sysctl

    - name: Apply sysctl drop-ins
      command: sysctl --system
      changed_when: false
      tags: sysctl

    - name: Read the invariants back after the reload
      command: "sysctl -n {{ k3s_sysctl_invariants.keys() | list | join(' ') }}"
      register: k3s_sysctl_effective
      changed_when: false
      tags: sysctl

    - name: Fail if a drop-in lost the merge
      assert:
        that:
          - k3s_sysctl_effective.stdout_lines == (k3s_sysctl_invariants.values() | map('string') | list)
        fail_msg: >-
          sysctl.d did not merge to the k3s invariants. For
          {{ k3s_sysctl_invariants.keys() | list }} expected
          {{ k3s_sysctl_invariants.values() | list }}, got
          {{ k3s_sysctl_effective.stdout_lines }}.
          Either a drop-in is missing, or something in /etc/sysctl.d sorts after
          99-k3s-*.conf and overrode it. Writing the file is not evidence that
          it won -- that confusion is the root cause of SafeZone#63.
      tags: sysctl

    # fwupd manages firmware. A VM has no firmware its operator can touch, so
    # the daemon is dead weight there -- on ct-serv-jp it also fails on every
    # start. Bare metal keeps it: that is a real function on a machine whose
    # firmware someone actually maintains.
    #
    # Keyed on node_platform, not node_provider. "local" says the box sits in
    # the operator's house, not that it is bare metal -- a VM run at home is
    # also node_provider=local. See inventory.ini.
    #
    # Deliberately no autoremove (the apt module's default). Purging fwupd
    # orphans ~48 packages, jq and udisks2 among them; leaving them installed
    # is cheaper than reasoning about what else on the node wants them.
    - name: Remove fwupd on virtualized nodes
      apt:
        name: fwupd
        state: absent
        purge: yes
      when: node_platform == 'vm'
      tags: fwupd

    # --- k3s agent -------------------------------------------------------------
    # The control plane is provisioned outside this play; its unit, flags
    # included, is recorded in cluster/k3han/k3s/ct-serv-jp/k3s.service.
    #
    # --node-external-ip is the node's Tailscale address. flannel publishes it
    # as its VTEP endpoint, so the (normally unused) VXLAN fallback also runs
    # over the tailnet. It is passed to the installer so it lands in the unit
    # k3s generates, not appended to that unit afterwards.
    - name: Get Tailscale IP for external access
      command: tailscale ip -4
      register: tailscale_ip
      changed_when: false

    - name: Install K3s agent with specified node name
      shell: |
        curl -sfL https://get.k3s.io | K3S_URL=https://{{ k3s_server_ip }}:6443 K3S_TOKEN={{ k3s_token }} sh -s - agent --node-name {{ inventory_hostname }} --node-external-ip {{ tailscale_ip.stdout }}
      when: "'control-plane' not in node_roles"
      tags: k3s

    # --- Pod data path ---------------------------------------------------------
    # Cross-node pod traffic does not ride flannel's VXLAN backend. Each node
    # advertises its pod CIDR as a Tailscale subnet route and accepts the
    # others'. Tailscale installs those routes in table 52 behind `ip rule`
    # pref 5270, which is consulted before the main table, so they win over
    # flannel's `via flannel.1` routes for the same prefixes. flannel remains
    # the CNI (IPAM, cni0, its iptables rules); only its overlay is idle.
    # Chorde#16.
    #
    # The pod CIDR comes from the node object k3s allocated it on. It used to
    # be inferred from svclb-traefik pod IPs, which returns nothing once
    # Traefik is disabled, and then the advertise task was skipped silently.
    - name: Get pod CIDR for node
      command: kubectl get node {{ inventory_hostname }} -o jsonpath={.spec.podCIDR}
      delegate_to: "{{ k3s_server_host }}"
      register: node_pod_cidr
      until: node_pod_cidr.stdout != ""
      retries: 12
      delay: 5
      changed_when: false
      tags: tailscale

    # `set`, not `up`: `up` re-applies the full preference set and resets any
    # flag not repeated on its command line. That is the likely way the node
    # tags set at join time, and the legacy 10.43 advertisement, disappeared
    # from every node (inferred, not reproduced).
    #
    # --snat-subnet-routes=false: with SNAT on, whether a cross-node client
    # keeps its pod IP depends on which of Tailscale's ts-forward and
    # kube-router's ACCEPT comes first in FORWARD, and nothing arbitrates that
    # order. On acer-agent Tailscale won, and every cross-node client reached
    # its pods as 10.42.1.1. NetworkPolicy was unaffected (FORWARD runs before
    # the POSTROUTING masquerade); the applications were not.
    - name: Advertise pod CIDR route via Tailscale
      command: >-
        tailscale set
        --accept-routes=true
        --advertise-routes={{ node_pod_cidr.stdout }}
        --snat-subnet-routes=false
      tags: tailscale

    # Gate: assert the routing outcome, not the flags. Each check below fails
    # the play; any one of them failing means pod traffic has fallen back to
    # VXLAN inside WireGuard, which works, alerts nothing, and is never what
    # was intended. Mirrors scripts/test/pod-path/node-routing-test.sh.
    - name: Read tailscaled preferences back
      command: tailscale debug prefs
      register: tailscale_prefs_raw
      changed_when: false
      tags: tailscale

    - name: Fail unless this node advertises its own pod CIDR without SNAT
      assert:
        that:
          - (tailscale_prefs_raw.stdout | from_json).AdvertiseRoutes == [node_pod_cidr.stdout]
          - (tailscale_prefs_raw.stdout | from_json).RouteAll
          - (tailscale_prefs_raw.stdout | from_json).NoSNAT
        fail_msg: >-
          tailscaled prefs do not match the pod data path. Expected
          AdvertiseRoutes == [{{ node_pod_cidr.stdout }}], RouteAll and NoSNAT
          true.
      tags: tailscale

    - name: Get every node's pod CIDR
      command: kubectl get nodes --no-headers -o custom-columns=NAME:.metadata.name,CIDR:.spec.podCIDR
      delegate_to: "{{ k3s_server_host }}"
      run_once: true
      register: cluster_pod_cidrs
      changed_when: false
      tags: tailscale

    # A peer's route appears in table 52 only after the peer advertises it and
    # it is approved in the tailnet admin console. Approval is manual today, so
    # on a new node this gate fails until someone approves the route. That is
    # intended.
    - name: Resolve the route to every other node's pod CIDR
      command: "ip route get {{ item.split()[1].split('/')[0] | regex_replace('0$', '1') }}"
      loop: "{{ cluster_pod_cidrs.stdout_lines | reject('match', inventory_hostname ~ ' ') | list }}"
      register: peer_routes
      until: "'dev tailscale0 table 52' in peer_routes.stdout"
      retries: 12
      delay: 5
      changed_when: false
      tags: tailscale

    - name: Patch node labels dynamically from inventory
      shell: |
        kubectl label node {{ inventory_hostname }} \
          region={{ node_region }} tier={{ node_tier }} ha-level={{ node_ha_level }} provider={{ node_provider }} --overwrite
      ignore_errors: true
      tags: label

  # Reminder: This playbook is a formal documentation artifact.
  # It is designed to be scalable for multiple agents.

# Required per-host variables in inventory:
# node_region=tw
# node_tier=medium
# node_ha_level=local-24h
# node_provider=local
# node_platform=bare-metal|vm
#   Load-bearing: the fwupd task keys on it and takes no default, so a host
#   missing it fails the play. That is deliberate -- failing loudly beats
#   silently leaving firmware tooling on a guest. Chorde#10.
#
# node_roles="control-plane" | ""
#   The control plane is skipped by the k3s agent install. Chorde#16.
#
# Optional per-host variables:
# node_external_ip="<reserved public ip>"
#   Nothing in this playbook reads it. Recorded for humans; see inventory.ini
#   for what an empty value does and does not mean. Chorde#13.

