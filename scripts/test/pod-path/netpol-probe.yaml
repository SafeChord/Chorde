# Fixture for netpol-matrix-test.sh. One server and three clients per node,
# pinned by nodeName; see the test script for the expected matrix.
apiVersion: v1
kind: Namespace
metadata:
  name: netpol-probe
---
apiVersion: v1
kind: Pod
metadata:
  name: srv-acer
  namespace: netpol-probe
  labels:
    app: srv
    node: acer
spec:
  nodeName: acer-agent
  tolerations: [{operator: Exists}]
  terminationGracePeriodSeconds: 1
  containers:
  - name: c
    image: registry.k8s.io/e2e-test-images/agnhost:2.53
    args: ["netexec", "--http-port=8080"]
    resources: {requests: {cpu: 5m, memory: 16Mi}, limits: {memory: 64Mi}}
---
apiVersion: v1
kind: Pod
metadata:
  name: cli-acer-allowed
  namespace: netpol-probe
  labels:
    app: cli
    role: allowed
spec:
  nodeName: acer-agent
  tolerations: [{operator: Exists}]
  terminationGracePeriodSeconds: 1
  containers:
  - name: c
    image: registry.k8s.io/e2e-test-images/agnhost:2.53
    args: ["pause"]
    resources: {requests: {cpu: 5m, memory: 16Mi}, limits: {memory: 64Mi}}
---
