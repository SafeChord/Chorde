apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-alert-rules
  namespace: loki
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  error-alerts.yaml: |
    groups:
      - name: error-rate-alerts
        rules:
          - alert: HighErrorLogRate
            expr: |
              sum by (namespace, pod) (
                rate({job=~"alloy|fluent-bit"} |~ "(?i)level=error|\"level\":\"error\"|\\bERROR\\b" [5m])
              ) > 0.5
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High error log rate in {{ $labels.namespace }}/{{ $labels.pod }}"
  # Temporary (Chorde#80): fires at once, to show a Loki alert reaches
  # Alertmanager. Removed once seen there.
  ruler-path-check.yaml: |
    groups:
      - name: ruler-path-check
        rules:
          - alert: LokiRulerPathCheck
            expr: vector(1) > 0
            labels:
              severity: info
            annotations:
              summary: "Temporary: checks that Loki alerts reach Alertmanager (Chorde#80); removed once seen"
