alertmanager:
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['namespace', 'alertname']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: slack
      routes:
        - matchers:
            - alertname = "Watchdog"
          receiver: "null"
        # K3s runs kube-proxy, the scheduler and the controller-manager inside the
        # k3s binary, not as pods. The chart's Services for them select pods by
        # label, so they have no endpoints and no up series exists: these
        # absent(up{job=...}) alerts always fire and are not actionable.
        - matchers:
            - alertname =~ "KubeProxyDown|KubeSchedulerDown|KubeControllerManagerDown"
          receiver: "null"
        # TargetDown stays on slack. It fires only on targets that exist and fail
        # to scrape (up == 0), which the components above never produce, so every
        # TargetDown is a real scrape failure. Routing it to null in kube-system
        # and monitoring (0ce775e) hid the agents' unreachable node-exporter.
    receivers:
      - name: "null"
      - name: slack
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack-secret/slack_webhook_url
            channel: '#k3han-error-notification'
            send_resolved: true
            title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
            text: |
              {{ range .Alerts }}
              *Namespace:* {{ .Labels.namespace }}
              *Pod:* {{ .Labels.pod }}
              *Severity:* {{ .Labels.severity }}
              *Message:* {{ .Annotations.summary }}
              {{ end }}
    templates:
      - /etc/alertmanager/config/*.tmpl

  alertmanagerSpec:
    secrets:
      - alertmanager-slack-secret
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

grafana:
  serviceMonitor:
    enabled: false
  admin:
    existingSecret: grafana-admin-secret
    userKey: admin-user
    passwordKey: admin-password

  ingress:
    # Disabled: grafana is served by the NGF HTTPRoute now (Chorde #4 migration).
    enabled: false
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
      nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    ingressClassName: nginx-private
    hosts:
      - k3han.omh.idv.tw
    path: /grafana

  grafana.ini:
    server:
      root_url: "http://k3han.omh.idv.tw/grafana/"
      serve_from_sub_path: true

  sidecar:
    datasources:
      enabled: true
      defaultDatasourceEnabled: true
      searchNamespace: ALL

  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

kube-state-metrics:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

# Rewrite kubelet scrape targets to use Tailscale IPs (EXTERNAL-IP) so
# Prometheus on ct-serv-jp can reach agent nodes across the mesh.
# Every relabeling here and under prometheus-node-exporter spells out
# `action: replace`, the ServiceMonitor CRD's default. Left out, the API server
# fills it in, ArgoCD sees the live object differ from git, and self-heal
# re-syncs the app every five minutes without ever reaching Synced.
kubelet:
  serviceMonitor:
    # /metrics endpoint. Setting this list replaces the chart default, which
    # holds the metrics_path relabel that KubeletDown matches on; keep it first.
    relabelings:
      - action: replace
        sourceLabels: [__metrics_path__]
        targetLabel: metrics_path
      # acer-agent: 192.168.0.2 → 100.64.1.21
      - action: replace
        sourceLabels: [__address__]
        regex: '192\.168\.0\.2:(.*)'
        targetLabel: __address__
        replacement: '100.64.1.21:$1'
      # gce-agent-tw: 10.140.0.5 → 100.64.2.21
      - action: replace
        sourceLabels: [__address__]
        regex: '10\.140\.0\.5:(.*)'
        targetLabel: __address__
        replacement: '100.64.2.21:$1'
    # /metrics/cadvisor endpoint
    cAdvisorRelabelings:
      - action: replace
        sourceLabels: [__metrics_path__]
        targetLabel: metrics_path
      - action: replace
        sourceLabels: [__address__]
        regex: '192\.168\.0\.2:(.*)'
        targetLabel: __address__
        replacement: '100.64.1.21:$1'
      - action: replace
        sourceLabels: [__address__]
        regex: '10\.140\.0\.5:(.*)'
        targetLabel: __address__
        replacement: '100.64.2.21:$1'
    # /metrics/probes endpoint
    probesRelabelings:
      - action: replace
        sourceLabels: [__metrics_path__]
        targetLabel: metrics_path
      - action: replace
        sourceLabels: [__address__]
        regex: '192\.168\.0\.2:(.*)'
        targetLabel: __address__
        replacement: '100.64.1.21:$1'
      - action: replace
        sourceLabels: [__address__]
        regex: '10\.140\.0\.5:(.*)'
        targetLabel: __address__
        replacement: '100.64.2.21:$1'

prometheus-node-exporter:
  # to aviod node exporter mount the root directory on machines
  hostRootFsMount:
    enabled: false
  # node-exporter runs on hostNetwork, so its targets are node InternalIPs that
  # Prometheus on ct-serv-jp cannot reach; rewrite them to Tailscale IPs, as
  # for the kubelet above.
  prometheus:
    monitor:
      relabelings:
        # acer-agent: 192.168.0.2 → 100.64.1.21
        - action: replace
          sourceLabels: [__address__]
          regex: '192\.168\.0\.2:(.*)'
          targetLabel: __address__
          replacement: '100.64.1.21:$1'
        # gce-agent-tw: 10.140.0.5 → 100.64.2.21
        - action: replace
          sourceLabels: [__address__]
          regex: '10\.140\.0\.5:(.*)'
          targetLabel: __address__
          replacement: '100.64.2.21:$1'

prometheusOperator:  
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

prometheus:
  prometheusSpec:
    # the record be reserved in 7 days
    retention: 7d
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
    