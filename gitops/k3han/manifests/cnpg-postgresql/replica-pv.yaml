apiVersion: v1
kind: PersistentVolume
metadata:
  name: acer-local-5g-postgredb-replica
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-path
  # Reserved for its claim: acer-agent carries two 5Gi local-path volumes, and
  # without this the replica and the Kafka broker could bind each other's.
  claimRef:
    namespace: database
    name: db-replica-1
  local:
    path: /mnt/k3han-pv/postgresql-replica
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - acer-agent
