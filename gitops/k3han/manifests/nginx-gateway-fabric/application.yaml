apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-gateway-fabric
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    k3han.io/service: nginx-gateway-fabric
    argocd.argoproj.io/managed-by: application
spec:
  project: chorde
  # The chart's version and values, wrapped together (Chorde#77).
  source:
    repoURL: https://github.com/SafeChord/Chorde.git
    targetRevision: main
    path: gitops/k3han/charts/nginx-gateway-fabric
    helm:
      # MUST match the release name of the original `helm install` (`ngf`).
      # ArgoCD's Helm release name defaults to the Application name; leaving it
      # as `nginx-gateway-fabric` renders a SECOND, parallel NGF install whose
      # control plane fights the original over GatewayClass `nginx` and breaks
      # the data-plane Service endpoints. Pinning to `ngf` adopts in place.
      releaseName: ngf

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: nginx-gateway

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
