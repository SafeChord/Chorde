apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-gateway-fabric
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    k3han.io/service: nginx-gateway-fabric
    argocd.argoproj.io/managed-by: application
spec:
  project: chorde
  # The chart's version and values, wrapped together (Chorde#77).
  source:
    repoURL: https://github.com/SafeChord/Chorde.git
    targetRevision: main
    path: gitops/k3han/charts/nginx-gateway-fabric
    helm:
      # MUST stay `ngf`: every resource name the chart renders derives from it.
      # It was pinned to adopt the original `helm install ngf` in place; that
      # Helm release was retired on K3han (Chorde#98), and nothing is a Helm
      # release here now. ArgoCD's release name defaults to the Application
      # name; changing it to `nginx-gateway-fabric` renders a SECOND, parallel
      # NGF install whose control plane fights this one over GatewayClass
      # `nginx` and breaks the data-plane Service endpoints.
      releaseName: ngf

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: nginx-gateway

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
