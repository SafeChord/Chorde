
# Disable sealing key renewal: the key set stays fixed, so one off-cluster
# backup covers it (Docs safechord.security.md, Sealing Keys). The chart
# reads only this value; "0" must stay a quoted string.
keyrenewperiod: "0"

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

