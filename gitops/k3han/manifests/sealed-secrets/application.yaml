apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  labels: 
    k3han.io/service: sealed-secrets
    argocd.argoproj.io/managed-by: application
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: chorde
  # The chart's version and values, wrapped together (Chorde#77).
  source:
    repoURL: https://github.com/SafeChord/Chorde.git
    targetRevision: main
    path: gitops/k3han/charts/sealed-secrets

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: bootstrap

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
