apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fluent-bit
  namespace: argocd
  labels:
    k3han.io/service: fluent-bit
    argocd.argoproj.io/managed-by: application
spec:
  project: chorde
  # The chart's version and values, wrapped together (Chorde#77).
  source:
    repoURL: https://github.com/SafeChord/Chorde.git
    targetRevision: main
    path: gitops/k3han/charts/fluent-bit

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: loki

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
