apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: k3han-cluster
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.1.1
    # No image here: the operator picks the image built for its own release and this
    # version, by tag. A digest pin here ties the broker image to the operator release,
    # and the two sync as separate applications (Chorde#50); the chart's
    # kafka.image.tag maps every version to one image.
    # Raised once the last version move has soaked (Chorde#50): a raised
    # metadata version cannot be lowered with a Kafka downgrade.
    metadataVersion: 4.0-IV3
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: "1"
      transaction.state.log.replication.factor: "1"
      transaction.state.log.min.isr: "1"
      default.replication.factor: "1"
      min.insync.replicas: "1"
  entityOperator:
    topicOperator: {}
    userOperator: {}
