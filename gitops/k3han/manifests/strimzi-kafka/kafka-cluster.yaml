apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: k3han-cluster
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.3.2
    # No image here: the operator picks the image built for its own release and this
    # version, by tag. A digest pin here ties the broker image to the operator release,
    # and the two sync as separate applications (Chorde#50); the chart's
    # kafka.image.tag maps every version to one image.
    # The highest metadata version 4.3.2 supports, raised after its soak (Chorde#76).
    # It cannot be lowered: Kafka can no longer go below 4.3. A version move leaves
    # it behind; raise it once the move has soaked.
    metadataVersion: 4.3-IV0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: "1"
      transaction.state.log.replication.factor: "1"
      transaction.state.log.min.isr: "1"
      default.replication.factor: "1"
      min.insync.replicas: "1"
  entityOperator:
    topicOperator: {}
    userOperator: {}
