apiVersion: v1
kind: PersistentVolume
metadata:
  name: acer-local-5g-kafka
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-path
  # Reserved for its claim: acer-agent carries two 5Gi local-path volumes, and
  # without this the Kafka broker and the PostgreSQL replica could bind each other's.
  claimRef:
    namespace: kafka
    name: data-0-k3han-cluster-dual-role-0
  local:
    path: /mnt/k3han-pv/kafka
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - acer-agent
