# Chorde's overlay; the chart reads only what sits under its name.
loki:
  # Monolithic is the community chart's name for the single binary (chart 12.0.0).
  deploymentMode: Monolithic

  loki:
    auth_enabled: false
    image:
      tag: 3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    commonConfig:
      replication_factor: 1
    schemaConfig:
      configs:
        - from: 2024-04-01
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: index_
            period: 24h
    storage:
      type: s3
      bucketNames:
        chunks: amzn-loki-s3-jp
        ruler: amzn-loki-s3-jp
        admin: amzn-loki-s3-jp
      s3:
        region: ap-northeast-1
        s3ForcePathStyle: false

    # The chart reads the ruler from rulerConfig; rules sit under the tenant
    # directory, `fake` while auth is disabled (the loki-rules mount below).
    rulerConfig:
      alertmanager_url: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093
      enable_api: true
      storage:
        type: local
        local:
          directory: /var/loki/rules
      rule_path: /var/loki/rules-temp

  chunksCache:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

  resultsCache:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

  singleBinary:
    replicas: 1
    extraVolumes:
      - name: loki-rules
        configMap:
          name: loki-alert-rules
    extraVolumeMounts:
      - name: loki-rules
        mountPath: /var/loki/rules/fake
    persistence:
      enabled: true
      storageClass: local-path
      size: 10Gi
    extraEnv:
      - name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: s3-secret
            key: s3_access_key
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: s3-secret
            key: s3_secret_key
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 4Gi
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

  # Disable components we don't need or want to manage separately
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0

  gateway:
    enabled: false # We use the single binary directly
  monitoring:
    dashboards:
      enabled: false
    rules:
      enabled: false
    serviceMonitor:
      enabled: false
  test:
    enabled: false

  # The chart uses these tags for both cache StatefulSets. Its dependency values
  # expose tags rather than digest fields, so retain tag@digest in each tag.
  memcached:
    image:
      tag: 1.6.45-alpine@sha256:bfc2ee42c4edb65f436dafc6a61cbc6938c30118e11ddea2f968e1a2c90bb12a

  memcachedExporter:
    image:
      tag: v0.18.0@sha256:1458b31d4cae1a6618e85c8d31ecc49c4ebdcee3c8530be8d80d93e8792c4a58

  sidecar:
    image:
      tag: 2.14.3@sha256:52d311dcedd587421a236c4d6c621f05614c40a51386e955e0699dca97ec0880
