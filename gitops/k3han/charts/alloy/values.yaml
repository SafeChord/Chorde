# Chorde's overlay; the chart reads only what sits under its name.
alloy:
  # Pinned as tag@digest (Docs safechord.chorde.md section 4, item 1); moves with the chart version.
  # The chart writes image.tag into the app.kubernetes.io/version label, where `@` is not
  # allowed, so the digest goes in its own key; the chart then renders the image by digest
  # alone and the tag stays here as the record of what it is.
  image:
    tag: v1.21.3
    digest: sha256:8ab871206bd2d8f89277f53abffee5f452a293980788d52f85fa183a87a505a4

  controller:
    type: daemonset
    nodeSelector:
      chorde.io/tier: medium
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule

  alloy:
    mounts:
      varlog: true
      dockercontainers: false
    extraArgs:
      - --disable-reporting
    configMap:
      create: true
      content: |
        logging {
          level  = "info"
          format = "logfmt"
        }

        discovery.kubernetes "pods" {
          role = "pod"
        }

        discovery.relabel "local_pods" {
          targets = discovery.kubernetes.pods.targets

          // 1. 節點過濾
          rule {
            source_labels = ["__meta_kubernetes_pod_node_name"]
            action = "keep"
            regex  = env("HOSTNAME")
          }

          // 2. 關鍵標籤轉正 (必須在這裡做，否則採集後就抓不到了)
          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_node_name"]
            target_label  = "node_name"
          }

        }

        loki.source.kubernetes "pods" {
          targets    = discovery.relabel.local_pods.output
          forward_to = [loki.relabel.agent_label.receiver]
        }

        loki.relabel "agent_label" {
          forward_to = [loki.process.drop_old.receiver]

          rule {
            replacement  = "alloy"
            target_label = "job"
          }
        }

        loki.process "drop_old" {
          stage.drop {
            older_than          = "168h"
            drop_counter_reason = "entry_too_old"
          }
          forward_to = [loki.write.local.receiver]
        }

        loki.write "local" {
          endpoint {
            url = "http://loki.loki.svc.cluster.local:3100/loki/api/v1/push"
          }
        }

  ingress:
    enabled: false
