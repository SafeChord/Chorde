# Chorde's overlay; the chart reads only what sits under its name.
kube-prometheus-stack:
  alertmanager:
    config:
      global:
        resolve_timeout: 5m
      route:
        group_by: ['namespace', 'alertname']
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
        receiver: slack
        routes:
          - matchers:
              - alertname = "Watchdog"
            receiver: "null"
          # K3s runs kube-proxy, the scheduler and the controller-manager inside the
          # k3s binary, not as pods. The chart's Services for them select pods by
          # label, so they have no endpoints and no up series exists: these
          # absent(up{job=...}) alerts always fire and are not actionable.
          - matchers:
              - alertname =~ "KubeProxyDown|KubeSchedulerDown|KubeControllerManagerDown"
            receiver: "null"
          # TargetDown stays on slack. It fires only on targets that exist and fail
          # to scrape (up == 0), which the components above never produce, so every
          # TargetDown is a real scrape failure. Routing it to null in kube-system
          # and monitoring (0ce775e) hid the agents' unreachable node-exporter.
      receivers:
        - name: "null"
        - name: slack
          slack_configs:
            - api_url_file: /etc/alertmanager/secrets/alertmanager-slack-secret/slack_webhook_url
              channel: '#k3han-error-notification'
              send_resolved: true
              title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
              text: |
                {{ range .Alerts }}
                *Namespace:* {{ .Labels.namespace }}
                *Pod:* {{ .Labels.pod }}
                *Severity:* {{ .Labels.severity }}
                *Message:* {{ .Annotations.summary }}
                {{ end }}
      templates:
        - /etc/alertmanager/config/*.tmpl

    alertmanagerSpec:
      # Pinned by digest (Docs safechord.chorde.md section 4, item 1); moves with the chart version.
      image:
        sha: 39d8bb3966c694a124428a3a88fbcffd40bd069129ecd47c059f8a3f17c55f3b
      secrets:
        - alertmanager-slack-secret
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

  grafana:
    # Pinned by digest (Docs safechord.chorde.md section 4, item 1); moves with the chart version.
    # The test pod is a helm test hook; its digest is the one its tag resolved to when
    # pinned (2026-11-12).
    image:
      sha: 540b8afb775bf34aefce417e4329039daa5d44b6f2fbda6881397b1b247ca7df
    testFramework:
      image:
        tag: 1.14.0@sha256:5322b877351fda0cc435de8c6116de7d0a2ec79d7c680132a0ef329a633bc66f
    serviceMonitor:
      enabled: false
    admin:
      existingSecret: grafana-admin-secret
      userKey: admin-user
      passwordKey: admin-password

    ingress:
      # Disabled: grafana is served by the NGF HTTPRoute now (Chorde #4 migration).
      enabled: false
      annotations:
        nginx.ingress.kubernetes.io/ssl-redirect: "false"
        nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
        nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
      ingressClassName: nginx-private
      hosts:
        - k3han.omh.idv.tw
      path: /grafana

    grafana.ini:
      server:
        root_url: "http://k3han.omh.idv.tw/grafana/"
        serve_from_sub_path: true

    sidecar:
      image:
        sha: 52d311dcedd587421a236c4d6c621f05614c40a51386e955e0699dca97ec0880
      datasources:
        enabled: true
        defaultDatasourceEnabled: true
        searchNamespace: ALL

    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

  kube-state-metrics:
    # Pinned by digest (Docs safechord.chorde.md section 4, item 1); moves with the chart version.
    image:
      sha: sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

  # Rewrite kubelet scrape targets to use Tailscale IPs (EXTERNAL-IP) so
  # Prometheus on ct-serv-jp can reach agent nodes across the mesh.
  # Every relabeling here and under prometheus-node-exporter spells out
  # `action: replace`, the ServiceMonitor CRD's default. Left out, the API server
  # fills it in, ArgoCD sees the live object differ from git, and self-heal
  # re-syncs the app every five minutes without ever reaching Synced.
  kubelet:
    serviceMonitor:
      # /metrics endpoint. Setting this list replaces the chart default, which
      # holds the metrics_path relabel that KubeletDown matches on; keep it first.
      relabelings:
        - action: replace
          sourceLabels: [__metrics_path__]
          targetLabel: metrics_path
        # acer-agent: 192.168.0.2 → 100.64.1.21
        - action: replace
          sourceLabels: [__address__]
          regex: '192\.168\.0\.2:(.*)'
          targetLabel: __address__
          replacement: '100.64.1.21:$1'
        # gce-agent-tw: 10.140.0.5 → 100.64.2.21
        - action: replace
          sourceLabels: [__address__]
          regex: '10\.140\.0\.5:(.*)'
          targetLabel: __address__
          replacement: '100.64.2.21:$1'
      # /metrics/cadvisor endpoint
      cAdvisorRelabelings:
        - action: replace
          sourceLabels: [__metrics_path__]
          targetLabel: metrics_path
        - action: replace
          sourceLabels: [__address__]
          regex: '192\.168\.0\.2:(.*)'
          targetLabel: __address__
          replacement: '100.64.1.21:$1'
        - action: replace
          sourceLabels: [__address__]
          regex: '10\.140\.0\.5:(.*)'
          targetLabel: __address__
          replacement: '100.64.2.21:$1'
      # /metrics/probes endpoint
      probesRelabelings:
        - action: replace
          sourceLabels: [__metrics_path__]
          targetLabel: metrics_path
        - action: replace
          sourceLabels: [__address__]
          regex: '192\.168\.0\.2:(.*)'
          targetLabel: __address__
          replacement: '100.64.1.21:$1'
        - action: replace
          sourceLabels: [__address__]
          regex: '10\.140\.0\.5:(.*)'
          targetLabel: __address__
          replacement: '100.64.2.21:$1'

  prometheus-node-exporter:
    # Pinned by digest (Docs safechord.chorde.md section 4, item 1); moves with the chart version.
    image:
      digest: sha256:8c9bac11973b94b59be88d6e11fee4429aa743c8846cdc75d65b18db33f6a106
    # to aviod node exporter mount the root directory on machines
    hostRootFsMount:
      enabled: false
    # node-exporter runs on hostNetwork, so its targets are node InternalIPs that
    # Prometheus on ct-serv-jp cannot reach; rewrite them to Tailscale IPs, as
    # for the kubelet above.
    prometheus:
      monitor:
        relabelings:
          # acer-agent: 192.168.0.2 → 100.64.1.21
          - action: replace
            sourceLabels: [__address__]
            regex: '192\.168\.0\.2:(.*)'
            targetLabel: __address__
            replacement: '100.64.1.21:$1'
          # gce-agent-tw: 10.140.0.5 → 100.64.2.21
          - action: replace
            sourceLabels: [__address__]
            regex: '10\.140\.0\.5:(.*)'
            targetLabel: __address__
            replacement: '100.64.2.21:$1'

  prometheusOperator:  
    # Pinned by digest (Docs safechord.chorde.md section 4, item 1); moves with the chart version.
    # thanosImage is handed to the operator for a Thanos sidecar or ruler, and the
    # admission patch image runs only in hook jobs at each sync: neither runs long on
    # K3han, so their digests are the ones their tags resolved to when pinned (2026-11-12).
    image:
      sha: c7edf0379b7271ef1705dce258d2bb73820e299cc95559369e9f6fc3321639ec
    prometheusConfigReloader:
      image:
        sha: a1897c67478bc23434534e91ad3855280771196b1daf17144db9dbcb655bef71
    thanosImage:
      sha: 0a546b98a8dd47735456ab389983675ee363d68127e334937a9fceeea10da5e7
    admissionWebhooks:
      patch:
        image:
          sha: 778d97dc3986355625e14392419b3364c487a7c807d4d86ddad1df369129b082
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

  prometheus:
    prometheusSpec:
      # Pinned by digest (Docs safechord.chorde.md section 4, item 1); moves with the chart version.
      image:
        sha: 9764044e09eb2c9e1abdb12d0f0188d4efb7384b0262d3c080f0fc59045c89ba
      # the record be reserved in 7 days
      retention: 7d
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 10Gi

