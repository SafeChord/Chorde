# Chorde's overlay; the chart reads only what sits under its name.
strimzi-kafka-operator:
  # Strimzi Operator Helm Values
  # Ref: https://github.com/strimzi/strimzi-kafka-operator/blob/main/helm-charts/strimzi-kafka-operator/values.yaml

  # 預設會監控安裝所在的命名空間，因此不需要手動指定 watchNamespaces: [kafka]
  # 以避免 RoleBinding 重複定義導致 ArgoCD 報錯。

  # 節點調度與容忍度 (模仿原始 Kustomization 的 Patch)
  nodeSelector:
    node-role.kubernetes.io/control-plane: "true"

  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

  # 資源限制與優化 (如有需要)
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # 指定使用的 ServiceAccount 名稱 (1.3.1 仍只接受字串)
  serviceAccount: strimzi-cluster-operator

  # Images pinned as tag@digest (Docs safechord.chorde.md section 4, item 1); they move
  # with the chart version. The entity operator's topic and user operators run the
  # operator image through keys of their own. The Kafka image is left to the operator's
  # own version map, by tag: see strimzi-kafka/kafka-cluster.yaml.
  image:
    tag: 1.3.1@sha256:55f43849559a0d151be473c588c89e9d72649ecadf088c8b9d92d37654a5e5eb
  topicOperator:
    image:
      tag: 1.3.1@sha256:55f43849559a0d151be473c588c89e9d72649ecadf088c8b9d92d37654a5e5eb
  userOperator:
    image:
      tag: 1.3.1@sha256:55f43849559a0d151be473c588c89e9d72649ecadf088c8b9d92d37654a5e5eb
