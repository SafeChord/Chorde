# Chorde's overlay; the chart reads only what sits under its name.
cloudnative-pg:
  # CloudNativePG Operator Helm Values
  # Ref: https://github.com/cloudnative-pg/charts/blob/main/charts/cloudnative-pg/values.yaml

  # Pin operator to control-plane (ct-serv-jp)
  # Mirrors strimzi-operator placement — operators belong to control plane,
  # keeping API server communication local (< 1ms vs ~80ms cross-region).
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists

  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

  # Pinned as tag@digest (Docs safechord.chorde.md section 4, item 1); moves with the
  # chart version. The chart hands the same image to the operator as
  # OPERATOR_IMAGE_NAME, which each Postgres instance runs as its bootstrap init
  # container: changing it restarts every instance.
  image:
    tag: 1.30.1@sha256:923c267ec29636db3bee20f993d0ec4973fa22998e1adad37da79e4d32b5bc07
